name: Build Areia ESP
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build mod JAR
        run: gradle build
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Areia-ESP-1.21.11
          path: build/libs/*.jar
